# CI — makes the "green check" in CONTRIBUTING.md real. Each job runs the exact
# gate a contributor is told to run locally, so a passing PR means the gates the
# product depends on (rules = the security boundary, honesty copy builds, the
# detection brain analyzes + tests) actually held. All jobs run on every PR so
# branch-protection "required status checks" behave predictably (no path-filtered
# job that silently never reports). Keep them fast; split later if needed.
#
# Third-party actions are pinned to a full commit SHA (tag in trailing comment),
# not a mutable tag — a hijacked tag would run arbitrary code in CI. Blast radius
# is already bounded (contents:read, no secrets in these jobs), this is
# defense-in-depth. dependabot.yml keeps the pins fresh so they don't rot.
name: CI

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]

# Supersede in-flight runs for the same ref to save minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  app:
    name: App · flutter analyze + test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Pin the Flutter version for reproducibility — `stable` floats and a new
      # release can redden `flutter analyze` on an unrelated PR. 3.44.4 ships
      # Dart 3.12.2, which satisfies the app's sdk: ^3.11.4 constraint.
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: 3.44.4
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  landing:
    name: Landing · type-check + build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: landing
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: landing/package-lock.json
      - run: npm ci
      - run: npm run build # tsc -b && vite build — the honesty copy must compile

  functions:
    name: Functions · type-check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: landing/functions
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: landing/functions/package-lock.json
      - run: npm ci
      - run: npm run build # tsc — the non-money backend must compile

  rules:
    name: Firestore rules · emulator tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: landing/firestore-tests
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: landing/firestore-tests/package-lock.json
      # The Firebase emulator is a JVM app; the suite spins it up via emulators:exec.
      # Java 21: firebase-tools >= 15 (firestore-tests devDep) requires JDK 21+.
      - uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm test # firebase emulators:exec ... 'vitest run' — the real security boundary

  secrets:
    name: Secrets · gitleaks scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # The server-side backstop for the .githooks/pre-commit gate: a local hook
    # can be missing, lack the binary, or be skipped with --no-verify, so the
    # real enforcement lives here. Same scan a contributor runs locally.
    env:
      GITLEAKS_VERSION: "8.30.1" # keep in sync with .githooks/pre-commit guidance
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # full history so `gitleaks git` scans every commit, not just HEAD
      # Install the pinned gitleaks binary directly. We deliberately do NOT use
      # gitleaks/gitleaks-action: it requires a paid GITLEAKS_LICENSE for GitHub
      # orgs. The binary is free, and integrity is verified against the release's
      # own checksums file before we trust it.
      - name: Install gitleaks
        run: |
          set -euo pipefail
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          asset="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL "${base}/${asset}" -o "${asset}"
          curl -sSfL "${base}/gitleaks_${GITLEAKS_VERSION}_checksums.txt" -o checksums.txt
          grep -F -- "${asset}" checksums.txt | sha256sum -c -
          tar -xzf "${asset}" gitleaks
          sudo install gitleaks /usr/local/bin/gitleaks
          gitleaks version
      # Auto-discovers .gitleaks.toml at the repo root. Non-zero exit fails the job.
      - name: Scan git history for secrets
        run: gitleaks git --no-banner --redact
