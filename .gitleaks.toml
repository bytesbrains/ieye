# gitleaks configuration — EXTENDS the built-in default ruleset.
#
# gitleaks auto-discovers this file at the repo root, so BOTH gates use it and
# behave identically:
#   - .githooks/pre-commit          -> gitleaks git --staged   (local, fast)
#   - .github/workflows/ci.yml      -> gitleaks git            (CI, full history)
#
# useDefault = true keeps EVERY upstream rule; we only add on top. Never replace
# the default set — that would silently drop detections.

title = "iEye gitleaks config"

[extend]
useDefault = true

# ---------------------------------------------------------------------------
# Allowlist — keep this TIGHT. Every entry here is a place gitleaks will stop
# looking, so it can hide a real secret. Add only proven, low-risk noise, and
# prefer a narrow regexTarget/path over a broad one. Use a `gitleaks:allow`
# trailing comment in source for one-off false positives instead of a rule here.
[allowlist]
description = "Repo-wide allowlist"
paths = [
  # Vendored dependencies are never scanned for OUR secrets. (Lockfiles are
  # deliberately NOT allowlisted — they're scanned, so a secret pasted into one
  # is still caught; gitleaks' default rules don't flag npm integrity hashes.)
  '''(^|/)node_modules/''',
]
