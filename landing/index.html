<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f4efe1" />

    <!-- Favicons + PWA manifest (from brand/icons/web, copied into public/icons) -->
    <link rel="icon" href="/icons/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/icons/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon-180x180.png" />
    <link rel="manifest" href="/icons/site.webmanifest" />

    <!-- SEO (hope-first, per copy spec #40 §9) -->
    <title>iEye — Gets help to you in time. A welfare app for people who live alone.</title>
    <meta
      name="description"
      content="iEye is a free, open welfare app that gets help to you in time. If you fall, crash, or go silent, it brings help fast and tells the people you chose — saving a life when a life can be saved. A public good, not a business."
    />
    <link rel="canonical" href="https://ieye.in/" />

    <!-- Open Graph — share copy is the line forwarded to a worried family member -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="iEye" />
    <meta property="og:title" content="iEye — Gets help to you in time." />
    <meta
      property="og:description"
      content="If your parent who lives alone ever falls or goes silent, iEye gets help to them fast and tells the people they chose — help in minutes when it counts, found in hours when it can't."
    />
    <meta property="og:image" content="https://ieye.in/ieye-logo-scene.png" />
    <meta property="og:image:alt" content="A lighthouse on a calm sea at twilight, casting one warm beam of light." />
    <meta property="og:url" content="https://ieye.in/" />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="iEye — Gets help to you in time." />
    <meta
      name="twitter:description"
      content="A free, open welfare app. If you fall, crash, or go silent, iEye brings help fast and tells the people you chose."
    />
    <meta name="twitter:image" content="https://ieye.in/ieye-logo-scene.png" />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
